services:
  # ── DATABASE ─────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus_pass
      POSTGRES_DB: academic_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/results_aiml_normalized_postgres.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d academic_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - nexus-net

  # ── MONGODB (Auth & Chat History) ────────────────────────────────────
  mongodb:
    image: mongo:7-jammy
    container_name: nexus-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: nexus
      MONGO_INITDB_ROOT_PASSWORD: nexus_pass
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')", "-u", "nexus", "-p", "nexus_pass", "--authenticationDatabase", "admin"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - nexus-net

  # ── AGENT 1: Intent Agent (port 8001) ────────────────────────────────
  intent-agent:
    build:
      context: ./Intent_Agent3
      dockerfile: Dockerfile
    container_name: nexus-intent-agent
    environment:
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8001:8001"
    networks:
      - nexus-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── AGENT 2: Table Agent (port 8002) ─────────────────────────────────
  table-agent:
    build:
      context: ./table_agent
      dockerfile: Dockerfile
    container_name: nexus-table-agent
    environment:
      AIML_RESULTS_DATABASE_URL: postgresql://nexus:nexus_pass@postgres:5432/academic_db
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nexus-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── AGENT 3: Column Pruning Agent (port 8003) ─────────────────────────
  column-pruning:
    build:
      context: ./column_pruning_agent
      dockerfile: Dockerfile
    container_name: nexus-column-pruning
    environment:
      AIML_RESULTS_DATABASE_URL: postgresql://nexus:nexus_pass@postgres:5432/academic_db
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8003:8003"
    networks:
      - nexus-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── AGENT 4: SQL Query Generator (port 8004) ──────────────────────────
  sql-generator:
    build:
      context: ./SQL_QUERY_GENERATOR
      dockerfile: Dockerfile
    container_name: nexus-sql-generator
    environment:
      AIML_RESULTS_DATABASE_URL: postgresql://nexus:nexus_pass@postgres:5432/academic_db
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8004:8004"
    networks:
      - nexus-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── AGENT 5: SQL Validator (port 8005) ────────────────────────────────
  sql-validator:
    build:
      context: ./sql_validator_agent
      dockerfile: Dockerfile
    container_name: nexus-sql-validator
    environment:
      AIML_RESULTS_DATABASE_URL: postgresql://nexus:nexus_pass@postgres:5432/academic_db
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8005:8005"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nexus-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── AGENT 6: Audit Agent (port 8006) ──────────────────────────────────
  audit-agent:
    build:
      context: ./Audit_agent
      dockerfile: Dockerfile
    container_name: nexus-audit-agent
    environment:
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8006:8006"
    networks:
      - nexus-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8006/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── AGENT 7: Retriever Agent (port 8007) ──────────────────────────────
  retriever-agent:
    build:
      context: ./retriever_agent
      dockerfile: Dockerfile
    container_name: nexus-retriever-agent
    environment:
      AIML_RESULTS_DATABASE_URL: postgresql://nexus:nexus_pass@postgres:5432/academic_db
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8007:8007"
    networks:
      - nexus-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8007/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── ORCHESTRATOR (port 8000) ──────────────────────────────────────────
  orchestrator:
    build:
      context: ./synthetic-agent
      dockerfile: Dockerfile
    container_name: nexus-orchestrator
    environment:
      AIML_RESULTS_DATABASE_URL: postgresql://nexus:nexus_pass@postgres:5432/academic_db
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      HOST_EMAIL: ${HOST_EMAIL:-admin@nexus.ai}
      HOST_PASSWORD: ${HOST_PASSWORD:-Admin@123}
      MONGO_URL: mongodb://nexus:nexus_pass@mongodb:27017/nexus_auth?authSource=admin
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      INTENT_AGENT_URL: http://intent-agent:8001
      TABLE_AGENT_URL: http://table-agent:8002
      COLUMN_PRUNING_URL: http://column-pruning:8003
      SQL_GENERATOR_URL: http://sql-generator:8004
      SQL_VALIDATOR_URL: http://sql-validator:8005
      AUDIT_AGENT_URL: http://audit-agent:8006
      RETRIEVER_AGENT_URL: http://retriever-agent:8007
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - nexus-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── FRONTEND (React + Nginx, port 3000) ───────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nexus-frontend
    ports:
      - "3000:80"
    depends_on:
      - orchestrator
    networks:
      - nexus-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  pgdata:
  mongodata:

networks:
  nexus-net:
    driver: bridge
