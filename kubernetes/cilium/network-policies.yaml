apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-db-egress-agents
  namespace: default
spec:
  endpointSelector:
    matchLabels:
      nexus-role: db-client   # label added to: table-agent, column-pruning, sql-validator
  egress:
    - toEndpoints:
        - matchLabels:
            app: postgres
      toPorts:
