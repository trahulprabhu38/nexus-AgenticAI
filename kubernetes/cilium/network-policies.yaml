# =========================
# FRONTEND INGRESS (ISTIO)
# =========================
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: frontend-ingress
  namespace: default
spec:
  endpointSelector:
    matchLabels:
      k8s:app: frontend
  ingress:
    # Allow Istio ingress gateway
    - fromEndpoints:
        - matchLabels:
            k8s:istio: ingressgateway
            k8s:io.kubernetes.pod.namespace: istio-system
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP

    # Allow Istio sidecar health + metrics
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: istio-system
      toPorts:
        - ports:
            - port: "15021"
              protocol: TCP
            - port: "15090"
              protocol: TCP

    # Allow same namespace (important for stability)
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: default


---
# =========================
# FRONTEND → ORCHESTRATOR
# =========================
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: frontend-to-orchestrator
  namespace: default
spec:
  endpointSelector:
    matchLabels:
      k8s:app: orchestrator
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:app: frontend
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP


---
# =========================
# ORCHESTRATOR → AGENTS
# =========================
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: orchestrator-egress
  namespace: default
spec:
  endpointSelector:
    matchLabels:
      k8s:app: orchestrator
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:app: intent-agent
      toPorts:
        - ports:
            - port: "8001"
              protocol: TCP

    - toEndpoints:
        - matchLabels:
            k8s:app: table-agent
      toPorts:
        - ports:
            - port: "8002"
              protocol: TCP

    - toEndpoints:
        - matchLabels:
            k8s:app: column-pruning
      toPorts:
        - ports:
            - port: "8003"
              protocol: TCP

    - toEndpoints:
        - matchLabels:
            k8s:app: sql-generator
      toPorts:
        - ports:
            - port: "8004"
              protocol: TCP

    - toEndpoints:
        - matchLabels:
            k8s:app: sql-validator
      toPorts:
        - ports:
            - port: "8005"
              protocol: TCP

    - toEndpoints:
        - matchLabels:
            k8s:app: audit-agent
      toPorts:
        - ports:
            - port: "8006"
              protocol: TCP

    - toEndpoints:
        - matchLabels:
            k8s:app: retriever-agent
      toPorts:
        - ports:
            - port: "8007"
              protocol: TCP

    # DNS
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP


---
# =========================
# AGENTS INGRESS (ONLY ORCHESTRATOR)
# =========================
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: agents-ingress
  namespace: default
spec:
  endpointSelector:
    matchExpressions:
      - key: k8s:app
        operator: In
        values:
          - intent-agent
          - table-agent
          - column-pruning
          - sql-generator
          - sql-validator
          - audit-agent
          - retriever-agent
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:app: orchestrator


---
# =========================
# POSTGRES ACCESS
# =========================
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: postgres-ingress
  namespace: default
spec:
  endpointSelector:
    matchLabels:
      k8s:app: postgres
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:app: orchestrator
        - matchLabels:
            k8s:app: table-agent
        - matchLabels:
            k8s:app: column-pruning
        - matchLabels:
            k8s:app: sql-validator
        - matchLabels:
            job-name: postgres-init
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP


---
# =========================
# MONGODB ATLAS EGRESS
# =========================
# No in-cluster MongoDB — retriever-agent and audit-agent connect to Atlas over TLS
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: mongodb-atlas-egress
  namespace: default
spec:
  endpointSelector:
    matchExpressions:
      - key: k8s:app
        operator: In
        values:
          - retriever-agent
          - audit-agent
  egress:
    - toFQDNs:
        - matchPattern: "*.mongodb.net"
        - matchPattern: "*.3qfvi7m.mongodb.net"
      toPorts:
        - ports:
            - port: "27017"
              protocol: TCP
            - port: "443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP


---
# =========================
# EXTERNAL LLM ACCESS
# =========================
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: llm-egress
  namespace: default
spec:
  endpointSelector:
    matchExpressions:
      - key: k8s:app
        operator: In
        values:
          - sql-generator
          - intent-agent
          - orchestrator
  egress:
    - toFQDNs:
        - matchPattern: "*.openai.com"
        - matchPattern: "*.googleapis.com"
        - matchPattern: "*.anthropic.com"
        - matchPattern: "integrate.api.nvidia.com"
        - matchPattern: "api.nvcf.nvidia.com"
        - matchPattern: "*.nvidia.com"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP

    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP



