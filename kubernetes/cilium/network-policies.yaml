---
# Allow Istio ingress gateway → frontend (port 80)
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-ingress-to-frontend
  namespace: default
spec:
  endpointSelector:
    matchLabels:
      app: frontend
  ingress:
    - fromEndpoints:
        - matchLabels:
            app: istio-ingressgateway
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
    # Allow Istio sidecar health checks and mTLS
    - fromEndpoints:
        - matchLabels:
            app: istio-pilot
      toPorts:
        - ports:
            - port: "15090"
              protocol: TCP

---
# Allow frontend → orchestrator (nginx /api proxy)
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-frontend-to-orchestrator
  namespace: default
spec:
  endpointSelector:
    matchLabels:
      app: orchestrator
  ingress:
    - fromEndpoints:
        - matchLabels:
            app: frontend
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP

---
# Orchestrator → all pipeline agents
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-orchestrator-to-agents
  namespace: default
spec:
  endpointSelector:
    matchLabels:
      app: orchestrator
  egress:
    - toEndpoints:
        - matchLabels:
            app: intent-agent
      toPorts:
        - ports:
            - port: "8001"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app: table-agent
      toPorts:
        - ports:
            - port: "8002"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app: column-pruning
      toPorts:
        - ports:
            - port: "8003"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app: sql-generator
      toPorts:
        - ports:
            - port: "8004"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app: sql-validator
      toPorts:
        - ports:
            - port: "8005"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app: audit-agent
      toPorts:
        - ports:
            - port: "8006"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app: retriever-agent
      toPorts:
        - ports:
            - port: "8007"
              protocol: TCP
    # Allow DNS resolution
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP

