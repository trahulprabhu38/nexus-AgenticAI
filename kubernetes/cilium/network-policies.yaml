---
# sql-generator egress — needs to reach external LLM API (e.g. OpenAI/Gemini) over HTTPS
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-sql-generator-external-egress
  namespace: default
spec:
  endpointSelector:
    matchLabels:
      app: sql-generator
  egress:
    - toFQDNs:
        - matchPattern: "*.openai.com"
        - matchPattern: "*.googleapis.com"
        - matchPattern: "*.anthropic.com"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP

---
# intent-agent egress — may call external LLM for classification
apiVersion: cilium.io/v2
