apiVersion: apps/v1
kind: Deployment
metadata:
  name: table-agent
  labels:
    app: table-agent
    tier: agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: table-agent
  template:
    metadata:
      labels:
        app: table-agent
        tier: agent
    spec:
      containers:
        - name: table-agent
          image: trahulprabhu38/nexus-table_agent:latest
          ports:
            - containerPort: 8002
          envFrom:
            - configMapRef:
                name: nexus-config
            - secretRef:
                name: nexus-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 15
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"

---
apiVersion: v1
kind: Service
metadata:
  name: table-agent
  labels:
    app: table-agent
spec:
  selector:
    app: table-agent
  ports:
    - port: 8002
      targetPort: 8002
  type: ClusterIP
