apiVersion: apps/v1
kind: Deployment
metadata:
  name: table-agent
  labels:
    app: table-agent
    tier: agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: table-agent
  template:
    metadata:
      labels:
        app: table-agent
        tier: agent
    spec:
      containers:
        - name: table-agent
          image: nexus-backend:latest
          command: ["uvicorn", "table_agent.serve:app", "--host", "0.0.0.0", "--port", "8002"]
          ports:
            - containerPort: 8002
          envFrom:
            - configMapRef:
                name: nexus-config
            - secretRef:
                name: nexus-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
