apiVersion: apps/v1
kind: Deployment
metadata:
  name: column-pruning
  labels:
    app: column-pruning
    tier: agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: column-pruning
  template:
    metadata:
      labels:
        app: column-pruning
        tier: agent
    spec:
      containers:
        - name: column-pruning
          image: trahulprabhu38/nexus-column_pruning_agent:latest
          ports:
            - containerPort: 8003
          envFrom:
            - configMapRef:
                name: nexus-config
            - secretRef:
                name: nexus-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 15
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"

---
apiVersion: v1
kind: Service
metadata:
  name: column-pruning
  labels:
    app: column-pruning
spec:
  selector:
    app: column-pruning
  ports:
    - port: 8003
      targetPort: 8003
  type: ClusterIP
