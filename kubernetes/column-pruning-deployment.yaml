apiVersion: apps/v1
kind: Deployment
metadata:
  name: column-pruning
  labels:
    app: column-pruning
    tier: agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: column-pruning
  template:
    metadata:
      labels:
        app: column-pruning
        tier: agent
    spec:
      containers:
        - name: column-pruning
          image: nexus-backend:latest
          command: ["uvicorn", "column_pruning_agent.serve:app", "--host", "0.0.0.0", "--port", "8003"]
          ports:
            - containerPort: 8003
          envFrom:
            - configMapRef:
                name: nexus-config
            - secretRef:
                name: nexus-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
