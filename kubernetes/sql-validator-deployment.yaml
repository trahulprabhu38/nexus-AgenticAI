apiVersion: apps/v1
kind: Deployment
metadata:
  name: sql-validator
  labels:
    app: sql-validator
    tier: agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sql-validator
  template:
    metadata:
      labels:
        app: sql-validator
        tier: agent
    spec:
      containers:
        - name: sql-validator
          image: nexus-backend:latest
          command: ["uvicorn", "sql_validator_agent.serve:app", "--host", "0.0.0.0", "--port", "8005"]
          ports:
            - containerPort: 8005
          envFrom:
            - configMapRef:
                name: nexus-config
            - secretRef:
                name: nexus-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8005
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: 8005
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"

---

apiVersion: v1
kind: Service
metadata:
  name: sql-validator
  labels:
    app: sql-validator
spec:
  selector:
    app: sql-validator
  ports:
    - port: 8005
      targetPort: 8005
  type: ClusterIP
