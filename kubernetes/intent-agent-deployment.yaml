apiVersion: apps/v1
kind: Deployment
metadata:
  name: intent-agent
  labels:
    app: intent-agent
    tier: agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: intent-agent
  template:
    metadata:
      labels:
        app: intent-agent
        tier: agent
    spec:
      containers:
        - name: intent-agent
          image: trahulprabhu38/nexus-intent_agent3:latest
          ports:
            - containerPort: 8001
          envFrom:
            - configMapRef:
                name: nexus-config
            - secretRef:
                name: nexus-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"

---
apiVersion: v1
kind: Service
metadata:
  name: intent-agent
  labels:
    app: intent-agent
spec:
  selector:
    app: intent-agent
  ports:
    - port: 8001
      targetPort: 8001
  type: ClusterIP
