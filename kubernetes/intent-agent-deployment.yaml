apiVersion: apps/v1
kind: Deployment
metadata:
  name: intent-agent
  labels:
    app: intent-agent
    tier: agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: intent-agent
  template:
    metadata:
      labels:
        app: intent-agent
        tier: agent
    spec:
      containers:
        - name: intent-agent
          image: nexus-backend:latest
          command: ["uvicorn", "Intent_Agent3.serve:app", "--host", "0.0.0.0", "--port", "8001"]
          ports:
            - containerPort: 8001
          envFrom:
            - configMapRef:
                name: nexus-config
            - secretRef:
                name: nexus-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"

---

apiVersion: v1
kind: Service
metadata:
  name: intent-agent
  labels:
    app: intent-agent
spec:
  selector:
    app: intent-agent
  ports:
    - port: 8001
      targetPort: 8001
  type: ClusterIP
