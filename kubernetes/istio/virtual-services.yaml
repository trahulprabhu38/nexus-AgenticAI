---
# External ingress: all traffic hits frontend; /api/* is proxied by nginx to orchestrator internally
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: nexus-frontend
  namespace: default
spec:
  hosts:
    - "nexus.infradaily.dev"
  gateways:
    - nexus-gateway
  http:
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: frontend
            port:
              number: 80
      timeout: 60s
      retries:
        attempts: 2
        perTryTimeout: 30s
        retryOn: gateway-error,connect-failure,retriable-4xx

---
# Orchestrator — internal mesh only (called by frontend nginx /api proxy)
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: orchestrator
  namespace: default
spec:
  hosts:
    - orchestrator
  http:
    - route:
        - destination:
            host: orchestrator
            port:
              number: 8000
      timeout: 120s
      retries:
        attempts: 3
        perTryTimeout: 40s
        retryOn: 5xx,reset,connect-failure

