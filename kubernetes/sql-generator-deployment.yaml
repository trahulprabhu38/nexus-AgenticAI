apiVersion: apps/v1
kind: Deployment
metadata:
  name: sql-generator
  labels:
    app: sql-generator
    tier: agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sql-generator
  template:
    metadata:
      labels:
        app: sql-generator
        tier: agent
    spec:
      containers:
        - name: sql-generator
          image: nexus-backend:latest
          command: ["uvicorn", "SQL_QUERY_GENERATOR.serve:app", "--host", "0.0.0.0", "--port", "8004"]
          ports:
            - containerPort: 8004
          envFrom:
            - configMapRef:
                name: nexus-config
            - secretRef:
                name: nexus-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
