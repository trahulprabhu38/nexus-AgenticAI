apiVersion: apps/v1
kind: Deployment
metadata:
  name: sql-generator
  labels:
    app: sql-generator
    tier: agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sql-generator
  template:
    metadata:
      labels:
        app: sql-generator
        tier: agent
    spec:
      containers:
        - name: sql-generator
          image: trahulprabhu38/nexus-sql_query_generator:latest
          ports:
            - containerPort: 8004
          envFrom:
            - configMapRef:
                name: nexus-config
            - secretRef:
                name: nexus-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 15
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"

---
apiVersion: v1
kind: Service
metadata:
  name: sql-generator
  labels:
    app: sql-generator
spec:
  selector:
    app: sql-generator
  ports:
    - port: 8004
      targetPort: 8004
  type: ClusterIP
